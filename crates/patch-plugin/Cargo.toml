[package]
name = "patch-plugin"
description = "Patch's native VST3 plugin loading and processing support"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
rtrb = "0.3.5"
vst3-host = { version = "0.10.0", default-features = false }
xcb = "1.7"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"

[dev-dependencies]
xcb = { version = "1.7", features = ["xtest", "xfixes"] }

[lints]
workspace = true
